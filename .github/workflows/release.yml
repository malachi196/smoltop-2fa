name: Build and Release SmolTOP

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
    - name: Check out source code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-level: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      shell: bash

    - name: Build with PyInstaller (Windows/Linux)
      if: matrix.os != 'macos-latest'
      run: pyinstaller --onedir -p smoltop -n smoltop smoltop/__main__.py

    - name: Build with PyInstaller (macOS)
      if: matrix.os == 'macos-latest'
      run: pyinstaller --onedir -p smoltop -n smoltop smoltop/__main__.py

    - name: Zip the build output (Windows)
      if: matrix.os == 'windows-latest'
      run: Compress-Archive -Path dist/smoltop -DestinationPath smoltop-windows.zip
      shell: powershell

    - name: Zip the build output (Mac/Linux)
      if: matrix.os != 'windows-latest'
      run: tar -czf smoltop-${{ matrix.os }}.tar.gz -C dist smoltop

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          smoltop-windows.zip
          smoltop-*.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
